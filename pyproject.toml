[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liton"
version = "0.3.0"
description = "Translate a Linux application once, remember how, and run it forever."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EditByDrix" }]
keywords = [
    "linux",
    "compatibility",
    "elf",
    "appimage",
    "translation",
    "fex",
    "qemu",
    "box64",
    "arm64",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Emulators",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
liton = "liton.cli:main"

[project.urls]
Homepage = "https://github.com/ciao22king/Liton"
Source = "https://github.com/ciao22king/Liton"
Issues = "https://github.com/ciao22king/Liton/issues"
Changelog = "https://github.com/ciao22king/Liton/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["liton"]

[tool.setuptools.package-data]
liton = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
